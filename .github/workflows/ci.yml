name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # quoted, or YAML reads 3.10 as 3.1
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: isort
        run: poetry run isort --check-only --skip-glob '*/migrations/*' .

      - name: black
        run: poetry run black --check --exclude '.*migrations/.*' .

      - name: Django checks
        run: poetry run python manage.py check

      - name: Test
        run: poetry run python manage.py test
